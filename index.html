<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Team Playoffs Bracket</title>
  <style>
    /* Bracket Layout Container */
    .bracket-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 50px;
      padding: 40px;
      background-color: #000000;
      color: #ffffff;
      font-family: monospace;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Round Columns */
    .round {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .quarterfinals {
      justify-content: space-between;
      gap: 15px;
    }

    .semifinals {
      justify-content: space-around;
      padding: 40px 0;
    }

    .finals {
      justify-content: center;
      padding: 140px 0;
    }

    /* Matchup Box */
    .matchup {
      display: flex;
      flex-direction: column;
      background: #121212;
      border: 1px solid #333333;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 2;
    }

    /* Individual Team Row */
    .team {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid #222222;
      background-color: #0a0a0a;
      transition: background-color 0.2s ease;
    }

    .team:last-child {
      border-bottom: none;
    }

    .team:hover {
      background-color: #1a1a1a;
    }

    .team.winner {
      color: #ffe600;
      font-weight: bold;
    }

    /* Score Styling */
    .score {
      font-weight: bold;
      padding-left: 10px;
      color: #777777;
    }

    .team.winner .score {
      color: #ffe600;
    }

    /* Connector Lines using pseudo-elements */
    .quarterfinals .matchup::after {
      content: '';
      position: absolute;
      right: -25px;
      top: 50%;
      width: 25px;
      height: 2px;
      background-color: #ffe600;
    }

    .semifinals .matchup::after {
      content: '';
      position: absolute;
      right: -25px;
      top: 50%;
      width: 25px;
      height: 2px;
      background-color: #ffe600;
    }
  </style>
</head>
<body>

  <div class="bracket-container">
    <!-- Quarterfinals -->
    <div class="round quarterfinals">
      <div class="matchup">
        <div class="team winner"><span>Team 1</span><span class="score">3</span></div>
        <div class="team"><span>Team 8</span><span class="score">1</span></div>
      </div>
      <div class="matchup">
        <div class="team winner"><span>Team 4</span><span class="score">3</span></div>
        <div class="team"><span>Team 5</span><span class="score">2</span></div>
      </div>
      <div class="matchup">
        <div class="team winner"><span>Team 2</span><span class="score">3</span></div>
        <div class="team"><span>Team 7</span><span class="score">0</span></div>
      </div>
      <div class="matchup">
        <div class="team winner"><span>Team 3</span><span class="score">3</span></div>
        <div class="team"><span>Team 6</span><span class="score">1</span></div>
      </div>
    </div>

    <!-- Semifinals -->
    <div class="round semifinals">
      <div class="matchup">
        <div class="team winner"><span>Team 1</span><span class="score">3</span></div>
        <div class="team"><span>Team 4</span><span class="score">1</span></div>
      </div>
      <div class="matchup">
        <div class="team winner"><span>Team 2</span><span class="score">3</span></div>
        <div class="team"><span>Team 3</span><span class="score">2</span></div>
      </div>
    </div>

    <!-- Finals -->
    <div class="round finals">
      <div class="matchup">
        <div class="team winner"><span>Team 1</span><span class="score">3</span></div>
        <div class="team"><span>Team 2</span><span class="score">1</span></div>
      </div>
    </div>
  </div>

</body>
</html>
