<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Volleyball League (RVL) - Match Tracker & Standings</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d28;
            --card-border: #2a2e3d;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #60a5fa;
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 8px;
            color: #93c5fd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #0f111a;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .score-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .btn-danger {
            background-color: var(--accent-red);
            padding: 4px 8px;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background-color: #121520;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        tbody tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        .rank {
            font-weight: bold;
            color: var(--gold);
            width: 40px;
        }

        .team-name {
            font-weight: 600;
        }

        .badge {
            background: #2563eb;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .match-item {
            background: #121520;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--card-border);
        }

        .match-teams {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .winner {
            color: #4ade80;
            font-weight: bold;
        }

        .score-display {
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .empty-msg {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ROBLOX VOLLEYBALL LEAGUE</h1>
        <p>Official RVL Match Tracker & Standings Hub</p>
    </header>

    <div class="container">

        <!-- Standings Table -->
        <div class="card full-width">
            <h2>League Standings <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">Ranked by Win-Loss Ratio</span></h2>
            <table>
                <thead>
                    <tr>
                        <th class="rank">#</th>
                        <th>Team</th>
                        <th>Played</th>
                        <th>Wins (W)</th>
                        <th>Losses (L)</th>
                        <th>W-L Ratio</th>
                    </tr>
                </thead>
                <tbody id="standingsBody"></tbody>
            </table>
        </div>

        <!-- Match Recorder Form -->
        <div class="card">
            <h2>Log Match Result</h2>
            <form id="matchForm">
                <div class="form-group">
                    <label for="team1">Home Team</label>
                    <select id="team1" required></select>
                </div>

                <div class="form-group">
                    <label for="team2">Away Team</label>
                    <select id="team2" required></select>
                </div>

                <div class="score-inputs">
                    <div class="form-group">
                        <label for="score1">Home Sets Won</label>
                        <input type="number" id="score1" min="0" max="5" value="0" required>
                    </div>

                    <div class="form-group">
                        <label for="score2">Away Sets Won</label>
                        <input type="number" id="score2" min="0" max="5" value="0" required>
                    </div>
                </div>

                <button type="submit" class="btn">Record Match</button>
            </form>
        </div>

        <!-- Match History -->
        <div class="card">
            <h2>Recent Matches</h2>
            <div class="match-list" id="matchHistory"></div>
        </div>

    </div>

    <script>
        // All 15 Teams from your RVL roster image
        const teamNames = [
            "Inception", "OBSESSION", "Inside Out", "0", "KINGDOM",
            "THE ODYSSEY", "REQUIEM", "Final Destination", "SCREAM", "Sin city",
            "SOUL", "OPPENHEIMER", "Psycho", "F1", "Echo"
        ];

        let teamsData = JSON.parse(localStorage.getItem('rvl_teams')) || teamNames.map(name => ({
            name: name,
            wins: 0,
            losses: 0
        }));

        let matchLogs = JSON.parse(localStorage.getItem('rvl_matches')) || [];

        function saveData() {
            localStorage.setItem('rvl_teams', JSON.stringify(teamsData));
            localStorage.setItem('rvl_matches', JSON.stringify(matchLogs));
        }

        function populateDropdowns() {
            const t1Select = document.getElementById('team1');
            const t2Select = document.getElementById('team2');

            t1Select.innerHTML = '<option value="">Select Home Team</option>';
            t2Select.innerHTML = '<option value="">Select Away Team</option>';

            [...teamNames].sort().forEach(name => {
                t1Select.innerHTML += `<option value="${name}">${name}</option>`;
                t2Select.innerHTML += `<option value="${name}">${name}</option>`;
            });
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsBody');
            tbody.innerHTML = '';

            const sortedTeams = [...teamsData].map(team => {
                const totalPlayed = team.wins + team.losses;
                const ratio = totalPlayed === 0 ? 0 : (team.wins / totalPlayed);
                return { ...team, played: totalPlayed, ratio: ratio };
            }).sort((a, b) => {
                if (b.ratio !== a.ratio) return b.ratio - a.ratio;
                return b.wins - a.wins;
            });

            sortedTeams.forEach((team, idx) => {
                const displayRatio = team.played === 0 ? '.000' : team.ratio.toFixed(3);
                tbody.innerHTML += `
                    <tr>
                        <td class="rank">${idx + 1}</td>
                        <td class="team-name">${team.name}</td>
                        <td>${team.played}</td>
                        <td>${team.wins}</td>
                        <td>${team.losses}</td>
                        <td><span class="badge">${displayRatio}</span></td>
                    </tr>
                `;
            });
        }

        function renderHistory() {
            const historyContainer = document.getElementById('matchHistory');
            historyContainer.innerHTML = '';

            if (matchLogs.length === 0) {
                historyContainer.innerHTML = '<div class="empty-msg">No matches recorded yet.</div>';
                return;
            }

            matchLogs.slice().reverse().forEach((match, index) => {
                const realIndex = matchLogs.length - 1 - index;
                historyContainer.innerHTML += `
                    <div class="match-item">
                        <div class="match-teams">
                            <span class="${match.winner === match.team1 ? 'winner' : ''}">${match.team1}</span>
                            <span>vs</span>
                            <span class="${match.winner === match.team2 ? 'winner' : ''}">${match.team2}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="score-display">${match.score1} - ${match.score2}</span>
                            <button class="btn btn-danger" onclick="deleteMatch(${realIndex})">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('matchForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const t1Name = document.getElementById('team1').value;
            const t2Name = document.getElementById('team2').value;
            const s1 = parseInt(document.getElementById('score1').value);
            const s2 = parseInt(document.getElementById('score2').value);

            if (t1Name === t2Name) {
                alert('A team cannot play against itself!');
                return;
            }

            if (s1 === s2) {
                alert('Volleyball matches cannot end in a tie!');
                return;
            }

            const winner = s1 > s2 ? t1Name : t2Name;
            const loser = s1 > s2 ? t2Name : t1Name;

            teamsData.find(t => t.name === winner).wins += 1;
            teamsData.find(t => t.name === loser).losses += 1;

            matchLogs.push({
                team1: t1Name,
                team2: t2Name,
                score1: s1,
                score2: s2,
                winner: winner
            });

            saveData();
            renderStandings();
            renderHistory();

            document.getElementById('score1').value = 0;
            document.getElementById('score2').value = 0;
        });

        window.deleteMatch = function(index) {
            const match = matchLogs[index];
            const winnerTeam = teamsData.find(t => t.name === match.winner);
            const loserTeamName = match.winner === match.team1 ? match.team2 : match.team1;
            const loserTeam = teamsData.find(t => t.name === loserTeamName);

            if (winnerTeam) winnerTeam.wins = Math.max(0, winnerTeam.wins - 1);
            if (loserTeam) loserTeam.losses = Math.max(0, loserTeam.losses - 1);

            matchLogs.splice(index, 1);

            saveData();
            renderStandings();
            renderHistory();
        };

        populateDropdowns();
        renderStandings();
        renderHistory();
    </script>
</body>
</html>
